<style>
/* 신청·문의 (2026-10-29 리뉴얼 레이아웃으로 정비 — gallery.html·staff.html 과 같은 방식)
   기능은 그대로: 구글 폼 iframe 2개 주소, 탭 id(tab-seminar·tab-franchise·tab-info),
   switchTab·openTabFromHash, 주소 #seminar·#franchise·#dojang·#info 로 탭 열기.
   openTabFromHash 는 탭 버튼을 onclick 속성("'seminar'" 등)으로 찾으므로 버튼의 class="contact-tab" 과 onclick 을 바꾸지 말 것. */
.ct-head { margin-bottom: 48px; }
.ct-head .sa-lead { margin-top: 16px; }
.ct-body { max-width: 840px; }
/* 탭 — 각진 52px 기준 버튼 3개를 한 줄로 붙임. 선택된 탭은 검정 바탕 */
.contact-tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  /* #주소로 열 때 openTabFromHash 가 탭으로 scrollIntoView 한다. 탭 위의 제목·설명이 반쯤 잘려 보이지 않도록
     제목 영역보다 큰 여백을 줘서 페이지 맨 위에 멈추게 한다 — 탭은 PC·모바일 모두 첫 화면 안(약 370~400px)에 있다 */
  scroll-margin-top: 600px;
}
.contact-tab {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 52px; padding: 10px 12px; margin-left: -1px;
  border: 1px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink);
  font-family: var(--font-sans); font-size: 16px; font-weight: 700; line-height: 1.3; word-break: keep-all; cursor: pointer;
}
.contact-tab:first-child { margin-left: 0; }
.contact-tab:hover:not(.active) { background: var(--bg-sub); }
.contact-tab.active { background: var(--ink); color: var(--dark-ink); }
.contact-tab-content { display: none; }
.contact-tab-content.active { display: block; }
/* 폼 — 구글 폼 화면(흰 바탕)은 바꿀 수 없어 테두리만 맞춤 */
.form-wrap { border: 1px solid var(--ink); border-top: 0; background: #FFFFFF; }
.form-wrap iframe { display: block; width: 100%; border: 0; }
/* 연락처 안내 */
.ct-info { border: 1px solid var(--ink); border-top: 0; background: var(--bg); margin: 0; padding: 8px 32px; }
.ct-info__row { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--line-soft); }
.ct-info__row:last-child { border-bottom: 0; }
.ct-info dt { font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--accent); }
.ct-info dd { margin: 0; }
.ct-info__name { font-family: var(--font-serif); font-weight: 900; font-size: 24px; line-height: 1.3; }
.ct-info__sub { display: block; color: var(--muted); }
/* 전화·메일 링크 — 글자 모양은 그대로, 밑줄로만 링크 표시 */
a.ct-info__sub, .ct-info__mail { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
a.ct-info__sub { color: var(--muted); }
a.ct-info__sub:hover, .ct-info__mail:hover { color: var(--accent); }
@media (max-width: 760px) {
  .ct-head { margin-bottom: 32px; }
  .contact-tab { font-size: 15px; padding: 8px 6px; }
  .ct-info { padding: 4px 20px; }
  .ct-info__row { grid-template-columns: 1fr; gap: 8px; padding: 20px 0; }
}
</style>

<script src="js/stepper-layout.js"></script>
<script>
function switchTab(tab, btn){
  document.querySelectorAll('.contact-tab-content').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.contact-tab').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

// 주소 뒤 #seminar / #franchise(회원 도장 가입 문의, #dojang 도 같음) / #info 로 해당 탭을 바로 연다 (2026-10-26)
// 세미나 일정 페이지의 "세미나 신청하기" 등에서 contact.html#seminar 로 들어온다. 탭이 보이도록 탭 위치로 스크롤
function openTabFromHash(){
  var key = (location.hash || '').replace('#', '');
  if (key === 'dojang') key = 'franchise';
  if (['seminar', 'franchise', 'info'].indexOf(key) < 0) return;
  var btn = document.querySelector('.contact-tab[onclick*="\'' + key + '\'"]');
  if (!btn) return;
  switchTab(key, btn);
  var tabs = document.querySelector('.contact-tabs');
  if (tabs) tabs.scrollIntoView({ block: 'start' });
}
openTabFromHash();
window.addEventListener('hashchange', openTabFromHash);
</script>
