<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<link rel="stylesheet" href="css/stepper-a.css">
<style>
/* 활동 갤러리 (2026-10-26 리뉴얼 레이아웃으로 정비)
   사진은 Firebase Storage gallery/ 폴더 — 올린 시각 최신순, 8장씩 페이지 넘김.
   화면에는 원본(장당 2~5MB) 대신 미리보기 WebP 를 쓴다: 목록 gallery/_preview/thumb/, 크게 보기 gallery/_preview/view/
   (만들고 정리하는 법: docs/gallery-previews.md). 미리보기가 아직 없으면 원본으로 대신 보여 준다.
   예전 페이지는 페이지 버튼을 이 페이지에 없는 .gallery-section 에 붙이다 오류가 나 사진이 하나도 안 나왔다 → 버튼 칸을 따로 둔다 */
.gal-head { margin-bottom: 48px; }
.gal-head .sa-lead { margin-top: 16px; }
.gal-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1024px) { .gal-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .gal-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.gal-item { margin: 0; }
.gal-btn { display: block; width: 100%; padding: 0; border: 1px solid var(--line-soft); background: var(--bg-sub); cursor: zoom-in; aspect-ratio: 4 / 3; overflow: hidden; }
.gal-btn img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
.gal-btn:hover img { transform: scale(1.04); }
.gal-msg { grid-column: 1 / -1; padding: 64px 0; text-align: center; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.gal-pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 40px; }
.gal-pages .sa-btn { min-width: var(--touch); min-height: var(--touch); padding: 0 14px; font-family: var(--font-mono); font-size: 15px; }
.gal-pages .sa-btn[aria-current="page"] { background: var(--ink); color: var(--dark-ink); }
.gal-pages .sa-btn[disabled] { opacity: 0.35; cursor: default; }
.gal-count { margin-top: 16px; text-align: center; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
/* 크게 보기 */
.gal-view { position: fixed; inset: 0; z-index: 1200; background: rgba(17,17,17,0.94); display: flex; align-items: center; justify-content: center; padding: 64px 16px; }
.gal-view[hidden] { display: none; }
.gal-view img { max-width: 100%; max-height: 100%; object-fit: contain; }
.gal-view__btn { position: absolute; min-width: var(--touch); min-height: var(--touch); border: 1px solid var(--dark-ink); background: transparent; color: var(--dark-ink); font-size: 16px; font-weight: 700; cursor: pointer; padding: 0 14px; }
.gal-view__close { top: 12px; right: 12px; }
.gal-view__prev { left: 12px; top: 50%; transform: translateY(-50%); }
.gal-view__next { right: 12px; top: 50%; transform: translateY(-50%); }
.gal-view__pos { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: var(--dark-muted); font-family: var(--font-mono); font-size: 13px; }
</style>
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="sa-section" aria-labelledby="gallery-title">
    <div class="sa-wrap">
      <div class="gal-head">
        <p class="sa-label">GALLERY — 활동 기록</p>
        <h1 class="sa-h2" id="gallery-title">활동 갤러리</h1>
        <p class="sa-lead">더스텝퍼의 세미나와 활동 현장을 담았습니다.</p>
      </div>
      <ul class="gal-grid" id="galleryGrid" aria-live="polite">
        <li class="gal-msg">사진을 불러오는 중…</li>
      </ul>
      <nav class="gal-pages" id="galleryPages" aria-label="갤러리 페이지"></nav>
      <p class="gal-count" id="galleryCount"></p>
    </div>
  </section>
</main>

<div class="gal-view" id="galView" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <img id="galViewImg" alt="">
  <button type="button" class="gal-view__btn gal-view__close" id="galClose">닫기</button>
  <button type="button" class="gal-view__btn gal-view__prev" id="galPrev" aria-label="이전 사진">이전</button>
  <button type="button" class="gal-view__btn gal-view__next" id="galNext" aria-label="다음 사진">다음</button>
  <p class="gal-view__pos" id="galPos"></p>
</div>

<div id="site-footer"></div>


<script src="js/stepper-layout.js"></script>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getStorage, ref, listAll, getMetadata } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = getApps().length ? getApps()[0] : initializeApp({
  apiKey: "AIzaSyBD96_snsYdbET2vzkF7MY8nMJlfHiAxi4",
  authDomain: "thestepper-c9bfb.firebaseapp.com",
  projectId: "thestepper-c9bfb",
  storageBucket: "thestepper-c9bfb.firebasestorage.app",
  messagingSenderId: "787224576231",
  appId: "1:787224576231:web:04d4003f42ecace9016242"
});
const storage = getStorage(app);

const PER_PAGE = 8;
// 공개 읽기(storage.rules gallery/**) 주소 — 파일마다 getDownloadURL 을 부르지 않는다. v= 는 원본이 바뀌면 캐시를 새로
const fileUrl = (p, v) => 'https://firebasestorage.googleapis.com/v0/b/' + storage.app.options.storageBucket + '/o/' + encodeURIComponent(p) + '?alt=media&v=' + v;
const previewUrl = (kind, ph) => fileUrl('gallery/_preview/' + kind + '/' + ph.file + '.webp', ph.v);
// 미리보기가 없으면(새로 올린 직후 등) 원본으로 한 번만 바꿔 보여 줌
const withFallback = (img, ph) => { img.onerror = () => { img.onerror = null; img.src = ph.orig; }; };
const grid = document.getElementById('galleryGrid');
const pages = document.getElementById('galleryPages');
const countEl = document.getElementById('galleryCount');
let photos = [], page = 1;

function msg(text) { grid.innerHTML = '<li class="gal-msg">' + text + '</li>'; pages.innerHTML = ''; countEl.textContent = ''; }

async function load() {
  try {
    const res = await listAll(ref(storage, 'gallery/'));
    if (!res.items.length) { msg('등록된 사진이 없습니다.'); return; }
    photos = (await Promise.all(res.items.map(async (it) => {
      const meta = await getMetadata(it);
      return { file: it.name, v: meta.generation, orig: fileUrl(it.fullPath, meta.generation), time: new Date(meta.timeCreated).getTime() };
    }))).sort((a, b) => b.time - a.time);   // 올린 시각 최신순
    render(1);
  } catch (e) {
    console.warn('[gallery] 사진을 불러오지 못함:', e && e.code || e);
    msg('사진을 불러올 수 없습니다. 잠시 뒤 다시 시도해 주세요.');
  }
}

function render(p) {
  const total = Math.ceil(photos.length / PER_PAGE);
  page = Math.min(Math.max(1, p), total);
  const start = (page - 1) * PER_PAGE;
  grid.innerHTML = '';
  photos.slice(start, start + PER_PAGE).forEach((ph, i) => {
    const li = document.createElement('li'); li.className = 'gal-item';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'gal-btn';
    b.setAttribute('aria-label', '사진 ' + (start + i + 1) + ' 크게 보기');
    const img = document.createElement('img'); withFallback(img, ph); img.src = previewUrl('thumb', ph); img.alt = 'THE STEPPER 활동 사진 ' + (start + i + 1); img.loading = 'lazy';
    b.appendChild(img); b.addEventListener('click', () => openView(start + i));
    li.appendChild(b); grid.appendChild(li);
  });
  // 페이지 버튼 — 사진 목록 바로 아래 고정 칸(#galleryPages)
  pages.innerHTML = '';
  if (total > 1) {
    const mk = (label, target, opts = {}) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sa-btn'; b.textContent = label;
      if (opts.current) b.setAttribute('aria-current', 'page');
      if (opts.aria) b.setAttribute('aria-label', opts.aria);
      if (opts.disabled) b.disabled = true; else b.addEventListener('click', () => { render(target); document.getElementById('gallery-title').scrollIntoView({ block: 'start' }); });
      pages.appendChild(b);
    };
    mk('←', page - 1, { disabled: page === 1, aria: '이전 페이지' });
    for (let i = 1; i <= total; i++) mk(String(i), i, { current: i === page, aria: i + '페이지' });
    mk('→', page + 1, { disabled: page === total, aria: '다음 페이지' });
  }
  countEl.textContent = '사진 ' + photos.length + '장 · ' + page + ' / ' + total + '페이지';
}

// 크게 보기 (Esc 닫기, ← → 이동)
const view = document.getElementById('galView'), viewImg = document.getElementById('galViewImg'), pos = document.getElementById('galPos');
let cur = 0, lastFocus = null;
function show(i) { cur = (i + photos.length) % photos.length; withFallback(viewImg, photos[cur]); viewImg.src = previewUrl('view', photos[cur]); viewImg.alt = 'THE STEPPER 활동 사진 ' + (cur + 1); pos.textContent = (cur + 1) + ' / ' + photos.length; }
function openView(i) { lastFocus = document.activeElement; show(i); view.hidden = false; document.body.classList.add('sa-scroll-locked'); document.getElementById('galClose').focus(); }
function closeView() { view.hidden = true; document.body.classList.remove('sa-scroll-locked'); if (lastFocus) lastFocus.focus(); }
document.getElementById('galClose').addEventListener('click', closeView);
document.getElementById('galPrev').addEventListener('click', () => show(cur - 1));
document.getElementById('galNext').addEventListener('click', () => show(cur + 1));
view.addEventListener('click', (e) => { if (e.target === view) closeView(); });
document.addEventListener('keydown', (e) => {
  if (view.hidden) return;
  if (e.key === 'Escape') closeView(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
});

load();
</script>

<!-- 관리자 전용 메뉴 표시 제어 (상세 주석은 admin-nav.js 참고) -->
<script src="admin-nav.js" defer></script>
</body>
</html>
