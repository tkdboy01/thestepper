<link rel="stylesheet" href="css/stepper-a.css">
<style>
/* 세미나 일정 (2026-10-29 리뉴얼 레이아웃으로 정비 — gallery·staff·contact 와 같은 방식)
   기능은 그대로: Firestore schedules 읽기(loadSchedules)·카드(makeCard)·날짜(formatDate)·예정/지난 구분, 탭(switchTab).
   makeCard 가 만드는 .schedule-item / .schedule-date / .schedule-title / .schedule-detail 클래스에 메인 세미나 목록(.ix-schedule) 모양을 입힌다. */
.sc-head { margin-bottom: 40px; }
.sc-head .sa-lead { margin-top: 16px; }
.sc-body { max-width: 840px; }
/* 「세미나 신청하기」 — 각진 52px 빨강 버튼 (class seminar-apply-btn 은 다른 점검·링크용으로 유지) */
.seminar-apply-btn { margin-top: 0; gap: 8px; }
/* 예정 / 지난 탭 — 각진 52px 버튼 2개를 붙임, 선택된 탭은 검정 바탕 */
.schedule-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 200px)); margin: 48px 0 0; }
.schedule-tab {
  min-height: 52px; padding: 0 16px; margin-left: -1px; border: 1px solid var(--ink); border-radius: 0;
  background: transparent; color: var(--ink); font-family: var(--font-sans); font-size: 16px; font-weight: 700; cursor: pointer;
}
.schedule-tab:first-child { margin-left: 0; }
.schedule-tab:hover:not(.active) { background: var(--bg-sub); }
.schedule-tab.active { background: var(--ink); color: var(--dark-ink); }
/* 일정 목록 — 선만 있는 목록, 고정폭 글꼴 날짜 (메인 세미나 섹션과 같은 형식) */
.schedule-list-wrap { border-top: 1px solid var(--line); margin-top: 24px; }
.schedule-item {
  display: grid; grid-template-columns: 180px 1fr; grid-template-areas: "date title" "date detail";
  gap: 4px 16px; padding: 20px 0; border-bottom: 1px solid var(--line);
}
.schedule-date { grid-area: date; font-family: var(--font-mono); font-weight: 600; font-size: 15px; padding-top: 2px; }
.schedule-item.upcoming .schedule-date { color: var(--accent); }
.schedule-title { grid-area: title; font-weight: 700; font-size: 17px; }
.schedule-detail { grid-area: detail; font-size: 15px; color: var(--muted); }
.schedule-detail:empty { display: none; }
/* loadSchedules 가 넣는 안내 문구(로딩 중·지난 일정 없음·오류)는 인라인 스타일이 있어 글자 모양만 맞춤 */
.schedule-list-wrap > div:not(.schedule-item):not(.sc-empty) { color: var(--muted) !important; font-size: 16px !important; text-align: left !important; padding: 24px 0 !important; border-bottom: 1px solid var(--line); }
/* 예정 일정이 없을 때 */
.sc-empty { padding: 32px 0; border-bottom: 1px solid var(--line); }
.sc-empty p { margin: 0; font-size: 17px; }
.sc-empty p + p { color: var(--muted); font-size: 16px; margin-top: 4px; }
.sc-empty .sa-btns { margin-top: 24px; }
@media (max-width: 760px) {
  .schedule-tabs { grid-template-columns: repeat(2, 1fr); margin-top: 36px; }
  .schedule-item { grid-template-columns: 1fr; grid-template-areas: "date" "title" "detail"; gap: 2px; }
  .seminar-apply-btn { width: 100%; }
}
</style>
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="sa-section" id="schedule" aria-labelledby="schedule-title">
    <div class="sa-wrap">
      <div class="sc-head">
        <p class="sa-label">SCHEDULE — 세미나 일정</p>
        <h1 class="sa-h2" id="schedule-title">세미나 일정</h1>
        <p class="sa-lead">더스텝퍼 전국 세미나 일정입니다.</p>
      </div>
      <div class="sc-body">
        <!-- 세미나 신청 — 일정 목록과 상관없이 항상 보인다(예정 세미나가 없어도 희망 날짜로 신청 가능). contact.html 세미나 탭을 바로 연다 -->
        <a class="sa-btn sa-btn--red seminar-apply-btn" href="contact.html#seminar">세미나 신청하기 <span aria-hidden="true">→</span></a>
        <div class="schedule-tabs" role="tablist" aria-label="세미나 일정 구분">
          <button class="schedule-tab active" onclick="switchTab(this,'upcoming')">예정 일정</button>
          <button class="schedule-tab" onclick="switchTab(this,'past')">지난 일정</button>
        </div>
        <div id="panel-upcoming" class="schedule-panel active">
          <div id="upcomingList" class="schedule-list-wrap">
            <div style="text-align:center;padding:40px;color:#333">로딩 중...</div>
          </div>
        </div>
        <div id="panel-past" class="schedule-panel" style="display:none">
          <div id="pastList" class="schedule-list-wrap">
            <div style="text-align:center;padding:40px;color:#333">로딩 중...</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>


<script src="js/stepper-layout.js"></script>
<script>
function switchTab(btn, tabName) {
  btn.closest('.schedule-tabs').querySelectorAll('.schedule-tab').forEach(function(b){
    b.classList.remove('active');
  });
  btn.classList.add('active');
  document.getElementById('panel-upcoming').style.display = tabName === 'upcoming' ? '' : 'none';
  document.getElementById('panel-past').style.display = tabName === 'past' ? '' : 'none';
}
</script>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBD96_snsYdbET2vzkF7MY8nMJlfHiAxi4",
    authDomain: "thestepper-c9bfb.firebaseapp.com",
    projectId: "thestepper-c9bfb",
    storageBucket: "thestepper-c9bfb.firebasestorage.app",
    messagingSenderId: "787224576231",
    appId: "1:787224576231:web:04d4003f42ecace9016242"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일, ' + d.getFullYear();
  }

  function makeCard(d) {
    return '<div class="schedule-item ' + (d.type === 'past' ? 'past' : 'upcoming') + '">' +
      '<div class="schedule-date">' + formatDate(d.date) + '</div>' +
      '<div class="schedule-title">' + d.title + '</div>' +
      '<div class="schedule-detail">' + (d.detail || '') + '</div>' +
      '</div>';
  }

  async function loadSchedules() {
    try {
      var q = query(collection(db, 'schedules'), orderBy('date', 'desc'));
      var snap = await getDocs(q);

      var todayStr = new Date().toISOString().slice(0, 10); // 'YYYY-MM-DD'
      var upcoming = [], past = [];
      snap.forEach(function(docSnap) {
        var d = docSnap.data();
        if (d.date < todayStr) past.push(d);
        else upcoming.push(d);
      });

      // 예정 일정 (날짜 오름차순)
      upcoming.sort(function(a,b){ return a.date > b.date ? 1 : -1; });
      var upEl = document.getElementById('upcomingList');
      upEl.innerHTML = upcoming.length > 0
        ? upcoming.map(makeCard).join('')
        : '<div class="sc-empty"><p>예정된 세미나가 없습니다.</p><p>일정이 정해지면 이곳에 안내합니다.</p><div class="sa-btns"><a class="sa-btn sa-btn--black" href="contact.html#seminar">세미나 신청·문의</a></div></div>';

      // 지난 일정 (날짜 내림차순)
      var paEl = document.getElementById('pastList');
      paEl.innerHTML = past.length > 0
        ? past.map(makeCard).join('')
        : '<div style="text-align:center;padding:40px;color:#333;font-size:14px">지난 세미나 내역이 없습니다.</div>';

    } catch(e) {
      console.error('일정 로드 오류:', e);
      var errMsg = '<div style="text-align:center;padding:40px;color:#999;font-size:14px">일정을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
      var upEl = document.getElementById('upcomingList');
      var paEl2 = document.getElementById('pastList');
      if (upEl) upEl.innerHTML = errMsg;
      if (paEl2) paEl2.innerHTML = '';
    }
  }

  loadSchedules();
</script>

</body>
